[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinan-agentic-core"
version = "0.15.0"
description = "State-of-the-art framework for building AI agents with OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thomas Pernet-Coudrier", email = "t.pernetcoudrier@gmail.com"}
]
keywords = [
    "ai",
    "agents",
    "llm",
    "openai",
    "multi-agent",
    "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Every requirement carries a ceiling as well as a floor. An unbounded
# requirement hands a consumer — and a CI run — the next major on the day it is
# published: openai 3.0 replaced httpx with httpx2 and mcp 2.0 removed
# mcp.server.fastmcp, both of which reached this package unannounced. The
# ceiling is the major this package is written and tested against; raising it
# is a deliberate change, made against a suite that runs on the new major.
dependencies = [
    "openai-agents>=0.21.1,<0.23",  # OpenAI Agents SDK — >=0.21.1 carries ModelSettings.timeout
    # The three ranges below match the ones openai-agents declares for itself.
    # They are shared dependencies: resolving openai-agents already forces them
    # on every consumer, so a wider range here would only describe a combination
    # this package never installs or tests.
    "openai>=3.0.0,<4",  # Direct AsyncOpenAI / AsyncAzureOpenAI client construction, httpx2-backed
    "pydantic>=2.12.2,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# The SDK admits ``mcp>=1.19.0,<3``, but ``mcp/server_builder.py`` builds on
# ``FastMCP`` from ``mcp.server.fastmcp``, which MCP SDK v2 removed in favour of
# ``mcp.server.mcpserver``. Until the builder targets that API the extra
# declares the major it actually supports, so a consumer resolving today gets a
# working server instead of an ImportError.
mcp = [
    "mcp>=1.19.0,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "mcp>=1.19.0,<2",
    "types-PyYAML>=6.0",
    # The transport ``openai`` is built on. ``tests/conftest.py`` constructs the
    # ``httpx2.Request``/``Response`` pair ``APIStatusError`` reads back, so the
    # suite imports it directly and cannot rely on reaching it as a transitive:
    # the client swapped HTTP libraries once already. The range matches the one
    # ``openai`` declares for itself.
    "httpx2>=2.7.0,<3",
]

[project.urls]
Homepage = "https://github.com/thomaspernet/sinan-agentic"
Documentation = "https://github.com/thomaspernet/sinan-agentic#readme"
Repository = "https://github.com/thomaspernet/sinan-agentic"
Issues = "https://github.com/thomaspernet/sinan-agentic/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sinan_agentic_core*"]
exclude = ["workflows_core*", "tests*"]

[tool.setuptools.package-data]
sinan_agentic_core = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sinan_agentic_core --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["sinan_agentic_core"]
omit = [
    "sinan_agentic_core/__init__.py",
    "sinan_agentic_core/utils/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
