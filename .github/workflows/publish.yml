name: Publish

# A published, non-prerelease GitHub release tagged vX.Y.Z on main is what ships
# the package to PyPI. CI (tests and lint, from ci.yml) runs on the released
# commit first, and nothing is built or uploaded unless it passes. Upload goes
# through PyPI Trusted Publishing (OIDC): the publish job exchanges a
# short-lived GitHub token for an upload credential, so no PyPI token is stored
# in the repository.
#
# The tag is the version. setuptools-scm reads vX.Y.Z off the released commit
# when the package is built, so the release ships sinan-agentic-core==X.Y.Z and
# no version string is edited by hand at any point. Should setuptools-scm miss
# the tag it falls back to a development version instead of failing, so the
# build job reads the version back out of the built wheel and sdist and stops,
# before anything is uploaded, unless it is the tag without its leading v
# (.github/scripts/check_dist_version.py).
#
# When a run fails, the GitHub release still exists but nothing reaches PyPI.
# To recover:
# - a transient failure (a runner, the network, PyPI itself): re-run the failed
#   jobs of this workflow from the Actions tab — the tag and the version it
#   yields are unchanged, so the same package is built and uploaded.
# - a failure in the code (CI red on the released commit): fix it on dev,
#   promote, and publish a new release under the next patch tag. Do not move
#   the old tag; delete its GitHub release so it is not left marked Latest.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Prereleases are skipped here, and build and publish, which need this job,
  # are skipped with it.
  ci:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # setuptools-scm derives the version from the release tag, so the
      # checkout carries the full history and its tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # A version uploaded to PyPI can never be replaced, so a build that does
      # not carry the release tag's version stops here, before anything is
      # uploaded.
      - name: Check the built version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/check_dist_version.py "$RELEASE_TAG" dist/

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sinan-agentic-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
