name: Publish

# A published, non-prerelease GitHub release tagged vX.Y.Z on main is what ships
# the package to PyPI. Upload goes through PyPI Trusted Publishing (OIDC): the
# publish job exchanges a short-lived GitHub token for an upload credential, so
# no PyPI token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI never accepts the same version twice, so a tag that disagrees with
      # the version being built stops here, before anything is uploaded.
      - name: Check the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match pyproject.toml version 'v$version'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sinan-agentic-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
